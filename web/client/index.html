<html lang="en">

    <meta name="color-scheme" content="light" />

      name="description"
      content="CyberGuard AI — phishing, malware, breach and Wi-Fi security scanning in your browser."

      No referrer on outbound requests. This app is routinely handed hostile
      URLs to inspect, and the default policy would leak the page path — and
      with it, hints about what a user is scanning — to any third party.
    -->
