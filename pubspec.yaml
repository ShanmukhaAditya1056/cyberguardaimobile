name: cyberguard_ai
description: CyberGuard AI — Intelligent Mobile Security Assistant
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.0.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  lottie: ^3.1.2
  shimmer: ^3.0.0
  animations: ^2.0.11
  animated_text_kit: ^4.2.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0

  # Device APIs
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  network_info_plus: ^6.0.1
  installed_apps: ^1.4.0
  device_info_plus: ^10.1.2
  battery_plus: ^6.0.2

  # Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.2

  # Networking
  dio: ^5.4.3
  http: ^1.2.2

  # Crypto and security
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Utilities
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  clipboard: ^0.1.3
  path_provider: ^2.1.3
  intl: ^0.20.2
  flutter_local_notifications: ^17.1.2
  package_info_plus: ^8.1.1
  uuid: ^4.3.3

  # PDF / CSV report export (feature #5)
  pdf: ^3.10.8
  printing: ^5.12.0
  csv: ^6.0.0

  # QR phishing scanner (feature #10)
  mobile_scanner: ^5.1.1
  image_picker: ^1.0.7

  # Localisation (feature #15)
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/animations/
    - assets/data/
    - assets/models/
    - assets/models/tflite/
