name: cyberguard_ai
description: CyberGuard AI — Intelligent Mobile Security Assistant
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.0.0

  # UI
  # Ships the CupertinoIcons font. Nothing here uses CupertinoIcons directly,
  # but the Cupertino widgets the framework falls back to (text-selection
  # toolbar, adaptive back chevron) reference its IconData, and the release
  # build warns about the missing font family without it.
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0

  # Device APIs
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3

  # Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Networking
  dio: ^5.4.3
  http: ^1.2.2

  # Auth. Optional at build time — see the google-services.json guard in
  # android/app/build.gradle. Without that file the app still builds and runs;
  # AuthService just reports itself unconfigured.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # Crypto and security
  crypto: ^3.0.3

  # Utilities
  share_plus: ^11.0.0
  clipboard: ^0.1.3
  path_provider: ^2.1.3
  # Hands a vetted URL to the system browser. On Android the Smart Link
  # Interceptor does this through its own channel so it can exclude CyberGuard
  # from the chooser and avoid looping back into itself; every other platform
  # has no interceptor to loop through, so this is the hand-off there.
  url_launcher: ^6.3.0
  intl: ^0.20.2
  flutter_local_notifications: ^17.1.2
  uuid: ^4.3.3

  # PDF / CSV report export (feature #5). Reports are rendered with `pdf`,
  # written to a temp file and handed to the share sheet — see
  # report_export_service.dart. The `printing` plugin is deliberately absent:
  # nothing imported it, and its Android library breaks `assembleRelease`
  # with "resource android:attr/lStar not found".
  pdf: ^3.10.8
  csv: ^6.0.0

  # QR phishing scanner (feature #10)
  mobile_scanner: ^5.1.1
  image_picker: ^1.0.7

  # Screenshot AI scanner — on-device OCR (feature: Screenshot Scanner)
  #
  # Held at >=0.15.0 for iOS, not for any Dart-side feature. 0.13.x wraps
  # GoogleMLKit 6.x, whose pods pin GoogleUtilities ~> 7, while firebase_core 3
  # pulls GoogleUtilities ~> 8 — CocoaPods cannot satisfy both and `pod install`
  # fails to resolve. 0.15+ moved to GoogleMLKit 7.x, which is on GoogleUtilities
  # 8 and agrees with Firebase. The Dart API this app uses (TextRecognizer,
  # InputImage.fromFilePath, processImage) is unchanged across the bump.
  google_mlkit_text_recognition: ^0.15.0

  # Localisation (feature #15)
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  # Inter carries Latin/Greek/Cyrillic only, so the Hindi, Tamil and Telugu
  # locales need a companion face per script. They are wired up as
  # `fontFamilyFallback` (see AppTextStyles.fontFallback) rather than being
  # referenced directly, so Inter still wins for every glyph it actually has.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700

    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTamil-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700

    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTelugu-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700

  assets:
    - assets/animations/
    - assets/data/
    - assets/models/
    - assets/models/tflite/
    # Bundled so main.dart can feed them to LicenseRegistry — the OFL requires
    # the licence to ship alongside the fonts.
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-NotoSans.txt
