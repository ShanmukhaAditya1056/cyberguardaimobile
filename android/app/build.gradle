plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase auth is optional at build time.
//
// The google-services plugin fails the whole build when google-services.json
// is absent, which would break a clean checkout and CI for everyone who has
// not set up a Firebase project. Applying it only when the file is actually
// there keeps the app buildable either way: without it Firebase.initializeApp
// throws at startup, AuthService catches that and reports itself
// unconfigured, and the login screen explains what is missing.
//
// To turn auth on: create a Firebase project, register the Android app as
// com.cyberguard.ai with your signing SHA-1, and drop the downloaded
// google-services.json into android/app/. Nothing else needs changing.
def googleServicesConfig = file("google-services.json")
if (googleServicesConfig.exists()) {
    apply plugin: "com.google.gms.google-services"
    logger.lifecycle("google-services.json found — Firebase auth enabled")
} else {
    logger.lifecycle("google-services.json absent — building without Firebase auth")
}

// Release signing, kept out of version control.
//
// Create android/key.properties (gitignored) with:
//   storeFile=/absolute/path/to/upload-keystore.jks
//   storePassword=...
//   keyAlias=upload
//   keyPassword=...
//
// Generate the keystore with:
//   keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA \
//     -keysize 2048 -validity 10000 -alias upload
//
// Then add that keystore's SHA-1 to the Firebase console, or Google sign-in
// works in debug and fails in production — see docs/AUTH_SETUP.md.
//
// Without the file the release variant falls back to the debug keystore so
// CI and local release builds keep working. That fallback is fine for testing
// and NOT shippable: Play rejects debug-signed uploads, and a debug key is
// public knowledge.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    logger.lifecycle("key.properties found — release will be signed with the upload keystore")
} else {
    logger.lifecycle("key.properties absent — release falls back to the DEBUG keystore (not shippable)")
}

android {
    namespace "com.cyberguard.ai"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.cyberguard.ai"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Falls back to debug signing so CI and local release builds keep
            // working without a keystore. Play rejects debug-signed uploads,
            // so shipping requires android/key.properties.
            signingConfig hasReleaseKeystore
                ? signingConfigs.release
                : signingConfigs.debug

            // R8 is deliberately off. The app resolves ML Kit, Firebase and
            // several Flutter plugins reflectively, and shrinking without a
            // tested keep-rule set strips classes that only fail at runtime —
            // the worst possible failure mode for a security app. Turning this
            // on is worth doing, but only alongside a device test pass.
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
