org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NOTE: org.gradle.java.home is deliberately NOT set here.
#
# It used to pin an absolute Windows path to one developer's Android Studio
# install. That works on exactly one machine: every CI runner and every other
# clone fails at Gradle startup because the path does not exist, which is why
# the Android workflow was red on main for days while the same build succeeded
# locally.
#
# Flutter already resolves a supported JDK on its own — `flutter doctor -v`
# prints which one — and hands it to Gradle, so no pin is needed for the normal
# `flutter build` path.
#
# If your machine does need an explicit JDK (for example the `java` on your
# PATH is a version Flutter does not support yet), set it somewhere that is not
# committed:
#   flutter config --jdk-dir="/path/to/jdk"     preferred, per-user
#   ~/.gradle/gradle.properties                  org.gradle.java.home=...
