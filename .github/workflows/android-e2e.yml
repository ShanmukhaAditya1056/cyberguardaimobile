name: Android E2E (Appium)

# Builds the APK, boots an emulator, runs the Appium suite, and publishes
# reports — including when tests fail, because that is exactly the run whose
# report matters most.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (blank = all)'
        required: false
        default: ''
      api_level:
        description: 'Android API level'
        required: false
        default: '34'
      load_scenario:
        description: 'k6 profile: baseline | stress | spike | endurance'
        required: false
        default: 'baseline'
  schedule:
    # 02:30 UTC nightly — catches drift from dependency updates.
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.8'
  JAVA_VERSION: '17'
  API_LEVEL: ${{ github.event.inputs.api_level || '34' }}

jobs:
  # ── Stage 1-5: static checks + APK build ────────────────────────────────
  # ── Repo hygiene ────────────────────────────────────────────────────────
  # Cheap and first: a rejected 600 MB blob is the difference between a failed
  # check and a history rewrite. Same script the pre-commit hook runs, so the
  # two cannot drift.
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for oversized, vendored or secret files
        run: bash tool/check_repo_hygiene.sh

  build:
    name: Build APK
    needs: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk-path: build/app/outputs/flutter-apk/app-debug.apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore API key placeholder
        # api_keys.dart is gitignored (it holds a real key locally), so CI has
        # to create it. An empty key disables the Safe Browsing source, which
        # is exactly what we want: CI must never call a third-party API.
        run: |
          if [ ! -f lib/core/config/api_keys.dart ]; then
            cp lib/core/config/api_keys.example.dart lib/core/config/api_keys.dart
            echo "Created api_keys.dart from the example (empty keys — cloud intel stays disabled)."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Dart unit tests
        # Includes automation_corpus_test.dart, which guards the E2E URL
        # expectations. If it fails, the Appium suite would fail confusingly —
        # better to stop here with a clear reason.
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  # ── Release APK ─────────────────────────────────────────────────────────
  # The E2E suite deliberately runs against the debug APK (it needs a
  # debuggable build). This job proves the release variant also compiles and
  # publishes a shippable artifact. `release` signs with signingConfigs.debug
  # (android/app/build.gradle:33), so no keystore secret is required.
  build-release:
    name: Build release APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore API key placeholder
        run: |
          if [ ! -f lib/core/config/api_keys.dart ]; then
            cp lib/core/config/api_keys.example.dart lib/core/config/api_keys.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: '-Xmx4g -Dorg.gradle.daemon=false'

      - name: Build release App Bundle
        # The universal APK carries libflutter/libapp/ML Kit for all three
        # ABIs at once. Play splits an .aab per device, so the actual download
        # is roughly a third of the APK. This is the artifact to ship.
        run: flutter build appbundle --release
        env:
          GRADLE_OPTS: '-Xmx4g -Dorg.gradle.daemon=false'

      - name: Report artifact sizes
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          {
            echo "## Release artifacts"
            echo ""
            echo "| Artifact | Size | Notes |"
            echo "|---|---|---|"
            echo "| Universal APK | $(du -h "$APK" | cut -f1) | all ABIs, sideload only |"
            echo "| App Bundle | $(du -h "$AAB" | cut -f1) | Play splits per device |"
            echo ""
            echo "Commit \`$(echo "${{ github.sha }}" | cut -c1-8)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ── Load test ───────────────────────────────────────────────────────────
  # Runs the existing k6 profile in automation/performance. The target is the
  # bundled mock of the threat-intel contract, never Google Safe Browsing or
  # HIBP — the script's setup() refuses any non-local BASE_URL. Independent of
  # the emulator, so it runs in parallel with the E2E job.
  load-test:
    name: k6 load test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCENARIO: ${{ github.event.inputs.load_scenario || 'baseline' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start the mock threat-intel server
        working-directory: automation
        run: |
          node performance/mock-threat-intel-server.js > ../mock-server.log 2>&1 &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/health > /dev/null; then
              echo "Mock server is up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/health || {
            echo "::error::Mock server never became healthy."
            cat ../mock-server.log
            exit 1
          }

      - name: Run k6
        id: k6
        working-directory: automation
        run: |
          # handleSummary writes to reports/JSON/ relative to cwd.
          mkdir -p reports/JSON
          set +e
          k6 run -e SCENARIO="$SCENARIO" -e BASE_URL=http://127.0.0.1:8787 \
            performance/k6-load-test.js | tee ../k6-output.txt
          echo "K6_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Stop the mock server
        if: always()
        run: kill "$MOCK_PID" 2>/dev/null || true

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## k6 load test — \`$SCENARIO\`"
            echo ""
            if [ -f k6-output.txt ]; then
              echo '```'
              # The script's own text summary, not k6's raw metric dump.
              sed -n '/═══/,$p' k6-output.txt | head -40
              echo '```'
            else
              echo "k6 produced no output — see the \`load-test-report\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle for Pages
        if: always()
        run: |
          mkdir -p site/reports/latest
          cp automation/reports/JSON/load-test-results.json site/reports/latest/ 2>/dev/null || true
          cp k6-output.txt site/reports/latest/load-test-output.txt 2>/dev/null || true

      - name: Upload load-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: |
            site/
            mock-server.log
          retention-days: 30
          if-no-files-found: warn

      # k6 exits non-zero when a threshold is breached. Gate last so the
      # report is always uploaded first.
      - name: Apply threshold gate
        if: always()
        run: |
          if [ "${K6_EXIT:-1}" != "0" ]; then
            echo "::error::k6 thresholds were breached (exit ${K6_EXIT:-1})."
            exit 1
          fi
          echo "All k6 thresholds passed."

  # ── Stage 6-18: emulator, Appium, tests, reports ───────────────────────
  e2e:
    name: E2E on API ${{ github.event.inputs.api_level || '34' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Report which build configuration is under test
        # The suite behaves differently depending on whether the APK was
        # built with Firebase credentials. Without them the sign-in gate
        # stands down and the suite exercises an ungated app — which is
        # NOT what ships. Say so loudly rather than reporting a silent
        # green against a configuration nobody installs.
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "AUTH_MODE=gated" >> "$GITHUB_ENV"
            echo "- Auth: **gated** (Firebase configured, suite signs in)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "AUTH_MODE=ungated" >> "$GITHUB_ENV"
            {
              echo "- Auth: **ungated** — no GOOGLE_SERVICES_JSON secret."
              echo "  The sign-in gate is inactive in this build, so the E2E run does"
              echo "  **not** cover the shipping configuration. Add the"
              echo "  GOOGLE_SERVICES_JSON, CG_TEST_EMAIL and CG_TEST_PASSWORD secrets"
              echo "  to close that gap — see docs/AUTH_SETUP.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Install Appium and the UiAutomator2 driver
        working-directory: automation
        run: |
          npx appium driver install uiautomator2 || npx appium driver update uiautomator2
          npx appium driver list --installed

      - name: Enable KVM
        # Without KVM the emulator falls back to software rendering and the
        # suite times out rather than failing honestly.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created."

      - name: Run Appium E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CG_APP_PATH: ${{ github.workspace }}/build/app/outputs/flutter-apk/app-debug.apk
          CG_BUILD_NUMBER: ${{ github.run_number }}
          CG_COMMIT: ${{ github.sha }}
          CG_BRANCH: ${{ github.ref_name }}
          CG_RETRIES: '1'
          CG_PASS_THRESHOLD: '95'
          # Hard guarantee: no test may reach a third-party service from CI.
          CG_ALLOW_NETWORK_TESTS: 'false'
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            adb wait-for-device
            adb shell input keyevent 82 || true

            echo "::group::Device information"
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb devices -l
            echo "::endgroup::"

            echo "::group::Install APK"
            adb install -r -g "$CG_APP_PATH"
            adb shell pm list packages | grep cyberguard
            echo "::endgroup::"

            echo "::group::Start Appium"
            cd automation
            npx appium --allow-cors --relaxed-security --log-timestamp \
              --log ../appium-server.log &
            APPIUM_PID=$!
            echo "APPIUM_PID=$APPIUM_PID" >> "$GITHUB_ENV"

            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium is up after ${i}s"
                break
              fi
              sleep 1
            done
            curl -sf http://127.0.0.1:4723/status || { echo "Appium never became healthy"; exit 1; }
            echo "::endgroup::"

            echo "::group::Run suite"
            # These were once written as literal `\n` inside this block scalar,
            # which YAML does not interpret as a line break. bash then saw
            # `CG_TEST_EMAIL=... n CG_TEST_PASSWORD=... n npm test`, tried to
            # execute a command called `n`, and exited 127 — so the suite never
            # ran at all, and the job failed in a way that looked like a test
            # failure. These are real line continuations.
            CG_TEST_EMAIL="${{ secrets.CG_TEST_EMAIL }}" \
            CG_TEST_PASSWORD="${{ secrets.CG_TEST_PASSWORD }}" \
            npm test
            SUITE_EXIT=$?
            echo "::endgroup::"

            kill $APPIUM_PID 2>/dev/null || true
            echo "SUITE_EXIT=$SUITE_EXIT" >> "$GITHUB_ENV"
            # Do not fail the emulator step — artifacts are uploaded first and
            # the gate is applied at the end of the job.
            exit 0

      - name: Publish job summary
        if: always()
        run: |
          if [ -f automation/reports/Summary/summary.md ]; then
            cat automation/reports/Summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Android Appium E2E" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No summary was produced — the suite failed before reporting." >> "$GITHUB_STEP_SUMMARY"
            echo "See the \`appium-server.log\` and \`e2e-logs\` artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Artifacts are uploaded unconditionally ──────────────────────────
      - name: Upload Excel reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-reports
          path: automation/reports/Excel/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-reports
          path: automation/reports/HTML/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-results
          path: automation/reports/JSON/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: automation/screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            automation/logs/
            appium-server.log
          retention-days: 30
          if-no-files-found: warn

      - name: Bundle site for Pages
        if: always()
        run: |
          mkdir -p site/reports/latest
          cp -r automation/reports/HTML/. site/reports/latest/ 2>/dev/null || true
          cp -r automation/reports/Summary/. site/reports/latest/ 2>/dev/null || true
          mkdir -p site/reports/latest/screenshots
          cp -r automation/screenshots/. site/reports/latest/screenshots/ 2>/dev/null || true
          mkdir -p site/reports/latest/excel
          cp -r automation/reports/Excel/. site/reports/latest/excel/ 2>/dev/null || true
          cp automation/reports/JSON/execution-results.json site/reports/latest/ 2>/dev/null || true
          ls -R site | head -50

      - name: Upload Pages bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-bundle
          path: site/
          retention-days: 30
          if-no-files-found: warn

      # ── The gate, applied last so nothing is lost ───────────────────────
      - name: Apply pass-rate gate
        if: always()
        run: |
          if [ "${SUITE_EXIT:-1}" != "0" ]; then
            echo "::error::E2E suite failed the pass-rate gate (exit ${SUITE_EXIT:-1})."
            echo "All reports and screenshots were uploaded as artifacts."
            exit 1
          fi
          echo "E2E suite passed."
