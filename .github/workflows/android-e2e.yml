name: Android build & checks

# Static analysis, unit tests, the debug and release artifacts, and the k6
# load test.
#
# It no longer boots an emulator — see the note at the end of this file for
# why the Appium job was removed and how to run that suite yourself.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      load_scenario:
        description: 'k6 profile: baseline | stress | spike | endurance'
        required: false
        default: 'baseline'
  schedule:
    # 02:30 UTC nightly — catches drift from dependency updates.
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.8'
  JAVA_VERSION: '17'

jobs:
  # ── Repo hygiene ────────────────────────────────────────────────────────
  # Cheap and first: a rejected 600 MB blob is the difference between a failed
  # check and a history rewrite. Same script the pre-commit hook runs, so the
  # two cannot drift.
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for oversized, vendored or secret files
        run: bash tool/check_repo_hygiene.sh

  build:
    name: Build APK
    needs: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk-path: build/app/outputs/flutter-apk/app-debug.apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore API key placeholder
        # api_keys.dart is gitignored (it holds a real key locally), so CI has
        # to create it. An empty key disables the Safe Browsing source, which
        # is exactly what we want: CI must never call a third-party API.
        run: |
          if [ ! -f lib/core/config/api_keys.dart ]; then
            cp lib/core/config/api_keys.example.dart lib/core/config/api_keys.dart
            echo "Created api_keys.dart from the example (empty keys — cloud intel stays disabled)."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Dart unit tests
        # Includes automation_corpus_test.dart, which guards the E2E URL
        # expectations. If it fails, the Appium suite would fail confusingly —
        # better to stop here with a clear reason.
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  # ── Release APK ─────────────────────────────────────────────────────────
  # The debug APK above is what the Appium suite installs when run locally.
  # This job proves the release variant also compiles and publishes a
  # shippable artifact. `release` signs with signingConfigs.debug
  # (android/app/build.gradle:33), so no keystore secret is required.
  build-release:
    name: Build release APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore API key placeholder
        run: |
          if [ ! -f lib/core/config/api_keys.dart ]; then
            cp lib/core/config/api_keys.example.dart lib/core/config/api_keys.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: '-Xmx4g -Dorg.gradle.daemon=false'

      - name: Build release App Bundle
        # The universal APK carries libflutter/libapp/ML Kit for all three
        # ABIs at once. Play splits an .aab per device, so the actual download
        # is roughly a third of the APK. This is the artifact to ship.
        run: flutter build appbundle --release
        env:
          GRADLE_OPTS: '-Xmx4g -Dorg.gradle.daemon=false'

      - name: Report artifact sizes
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          {
            echo "## Release artifacts"
            echo ""
            echo "| Artifact | Size | Notes |"
            echo "|---|---|---|"
            echo "| Universal APK | $(du -h "$APK" | cut -f1) | all ABIs, sideload only |"
            echo "| App Bundle | $(du -h "$AAB" | cut -f1) | Play splits per device |"
            echo ""
            echo "Commit \`$(echo "${{ github.sha }}" | cut -c1-8)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ── Load test ───────────────────────────────────────────────────────────
  # Runs the existing k6 profile in automation/performance. The target is the
  # bundled mock of the threat-intel contract, never Google Safe Browsing or
  # HIBP — the script's setup() refuses any non-local BASE_URL.
  load-test:
    name: k6 load test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCENARIO: ${{ github.event.inputs.load_scenario || 'baseline' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start the mock threat-intel server
        working-directory: automation
        run: |
          node performance/mock-threat-intel-server.js > ../mock-server.log 2>&1 &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/health > /dev/null; then
              echo "Mock server is up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/health || {
            echo "::error::Mock server never became healthy."
            cat ../mock-server.log
            exit 1
          }

      - name: Run k6
        id: k6
        working-directory: automation
        run: |
          # handleSummary writes to reports/JSON/ relative to cwd.
          mkdir -p reports/JSON
          set +e
          k6 run -e SCENARIO="$SCENARIO" -e BASE_URL=http://127.0.0.1:8787 \
            performance/k6-load-test.js | tee ../k6-output.txt
          echo "K6_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Stop the mock server
        if: always()
        run: kill "$MOCK_PID" 2>/dev/null || true

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## k6 load test — \`$SCENARIO\`"
            echo ""
            if [ -f k6-output.txt ]; then
              echo '```'
              # The script's own text summary, not k6's raw metric dump.
              sed -n '/═══/,$p' k6-output.txt | head -40
              echo '```'
            else
              echo "k6 produced no output — see the \`load-test-report\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle for Pages
        if: always()
        run: |
          mkdir -p site/reports/latest
          cp automation/reports/JSON/load-test-results.json site/reports/latest/ 2>/dev/null || true
          cp k6-output.txt site/reports/latest/load-test-output.txt 2>/dev/null || true

      - name: Upload load-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: |
            site/
            mock-server.log
          retention-days: 30
          if-no-files-found: warn

      # k6 exits non-zero when a threshold is breached. Gate last so the
      # report is always uploaded first.
      - name: Apply threshold gate
        if: always()
        run: |
          if [ "${K6_EXIT:-1}" != "0" ]; then
            echo "::error::k6 thresholds were breached (exit ${K6_EXIT:-1})."
            exit 1
          fi
          echo "All k6 thresholds passed."

# ── The Appium suite is not run here ────────────────────────────────────
#
# The `e2e` job that used to live below drove the app on an emulator via
# Appium. It is removed, not disabled: it never once finished. The last run —
# the first where Appium started at all — spent the full 90-minute budget
# inside the suite and was cancelled without producing a single report, so it
# gated every push on a job that could not answer.
#
# Nothing about the suite itself is deleted. `automation/` and
# `tool/e2e_on_emulator.sh` are intact and still run locally against a real
# device or emulator:
#
#     cd automation && npm ci && npm test
#
# To put it back in CI, restore the job from git history
# (`git log -- .github/workflows/android-e2e.yml`) and give it a realistic
# per-test timeout first — the open question is why the suite hangs rather
# than fails, and a CI job is the worst place to investigate that.
#
# What still covers the Android build here: static analysis, the 163 Dart unit
# tests, and both the debug and release artifacts.
